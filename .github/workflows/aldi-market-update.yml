name: Aldi Sauces Market Update

on:
  schedule:
    # 22:00 UTC Tuesday is 08:00 AEST Wednesday (fixed UTC+10).
    - cron: '0 22 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aldi-market-update.yml'
      - 'scrape-aldi.ps1'
      - 'run-market-update.ps1'
      - 'send-baseline-test.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aldi-sauces-market-update
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GMAIL_USERNAME: liamdwaas@gmail.com
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_RECIPIENT: liam.dewaas@simplot.com
      EMAIL_SUBJECT: Aldi Sauces Market Update
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Send requested baseline test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Send requested baseline test')
        shell: powershell
        run: ./send-baseline-test.ps1

      - name: Run Aldi comparison and email verified changes
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Send requested baseline test')
        shell: powershell
        run: ./run-market-update.ps1

      - name: Save the successful baseline
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Send requested baseline test')
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Update Aldi product baseline"
            git push
          }

